[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-seo-wordpress-agent"
version = "1.0.0"
description = "Production-Ready YouTube-to-WordPress SEO Agent for DailyFindz"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.2",
    "bleach>=6.0.0",
    "yt-dlp>=2024.3.10"
]

[project.optional-dependencies]
local-transcription = [
    "faster-whisper>=1.0.0"
]
dev = [
    "pytest>=7.4.0",
    "responses>=0.23.3"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests"
]
